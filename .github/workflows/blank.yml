name: Android Build Workflow

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    defaults:
      run:
        working-directory: v2.2/CampMeds_V1_Fixed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every Gradle run appends to gradle-output.log so the failure step below can publish it: the log and
      # artifact download endpoints are not reachable from every environment, but the API is.
      - name: Run unit tests
        run: |
          set -eo pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a gradle-output.log

      - name: Compile instrumented tests
        run: |
          set -eo pipefail
          ./gradlew assembleDebugAndroidTest --console=plain 2>&1 | tee -a gradle-output.log

      - name: Build Debug APK
        run: |
          set -eo pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a gradle-output.log

      # The Gradle output is published as a job summary, as error annotations and as a check run of its own:
      # all three can be read back through the Actions API even where artifact and log downloads are not
      # reachable from the machine that is reviewing the build.
      - name: Publish Gradle output on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Gradle output (tail) for ${{ github.sha }}"
            echo '```'
            tail -c 60000 gradle-output.log 2>/dev/null || echo "gradle-output.log not found"
            echo '```'
          } > failure-report.md
          cat failure-report.md >> "$GITHUB_STEP_SUMMARY"

          # A single annotation survives per step, so it carries the very end of the log (where the failure is).
          python3 - <<'PY'
          import os

          path = "gradle-output.log"
          text = open(path, encoding="utf-8", errors="replace").read() if os.path.exists(path) else "gradle-output.log missing"
          escaped = text[-3800:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle output (tail)::{0}".format(escaped))
          PY

          # The full tail goes into a check run, whose output has a much larger limit.
          python3 - <<'PY'
          import json
          import os
          import subprocess

          path = "gradle-output.log"
          text = open(path, encoding="utf-8", errors="replace").read()[-60000:] if os.path.exists(path) else "gradle-output.log missing"
          payload = {
              "name": "gradle-output",
              "head_sha": os.environ.get("GITHUB_SHA", ""),
              "status": "completed",
              "conclusion": "failure",
              "output": {"title": "Gradle output (tail)", "summary": text},
          }
          subprocess.run(
              ["gh", "api", "-X", "POST", "repos/{0}/check-runs".format(os.environ.get("GITHUB_REPOSITORY", "")), "--input", "-"],
              input=json.dumps(payload).encode("utf-8"),
              check=False,
          )
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-test-reports
          path: v2.2/CampMeds_V1_Fixed/app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-debug-apk
          path: v2.2/CampMeds_V1_Fixed/app/build/outputs/apk/debug/app-debug.apk
