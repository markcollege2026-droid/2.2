name: Android Build Workflow

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: v2.2/CampMeds_V1_Fixed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every Gradle run appends to gradle-output.log so the failure step below can publish it: the log and
      # artifact download endpoints are not reachable from every environment, but the API is.
      - name: Run unit tests
        run: |
          set -eo pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a gradle-output.log

      - name: Compile instrumented tests
        run: |
          set -eo pipefail
          ./gradlew assembleDebugAndroidTest --console=plain 2>&1 | tee -a gradle-output.log

      - name: Build Debug APK
        run: |
          set -eo pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a gradle-output.log

      # The build log goes into the job summary so it can be read back through the Actions API even where
      # artifact and log downloads are unavailable.
      - name: Publish Gradle output on failure
        if: failure()
        run: |
          {
            echo "Gradle output (tail) for ${{ github.sha }}"
            echo '```'
            tail -c 60000 gradle-output.log 2>/dev/null || echo "gradle-output.log not found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-test-reports
          path: v2.2/CampMeds_V1_Fixed/app/build/reports/tests
          if-no-files-found: ignore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-debug-apk
          path: v2.2/CampMeds_V1_Fixed/app/build/outputs/apk/debug/app-debug.apk
