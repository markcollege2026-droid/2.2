name: Android Build Workflow

on:
  push:
    # main/master are the released lines. "arena/**" are the working branches this repository is developed
    # on, so a push there is built and tested instead of needing a manual dispatch.
    branches: ["main", "master", "arena/**"]
  pull_request:
    branches: ["main", "master", "arena/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    defaults:
      run:
        working-directory: v2.2/CampMeds_V1_Fixed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every Gradle run appends to gradle-output.log so the failure step below can publish it: the log and
      # artifact download endpoints are not reachable from every environment, but the API is.
      - name: Run unit tests
        run: |
          set -eo pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a gradle-output.log

      # Lint is reported, not enforced, in this step: the repository has no lint baseline yet, so failing the
      # build on pre-existing findings would hide the test results behind an unrelated error. The report is
      # uploaded below and the findings are printed into the job log.
      - name: Lint (reported, not blocking)
        continue-on-error: true
        run: |
          set -eo pipefail
          ./gradlew lintDebug --console=plain 2>&1 | tee -a gradle-output.log

      # Lint's own summary only lives in the uploaded HTML/TXT report, which cannot be read back from every
      # environment. Surface the counts and the errors as annotations, which can.
      - name: Report lint findings
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          paths = sorted(glob.glob("app/build/reports/lint-results-debug.xml"))
          if not paths:
              print("::warning title=Lint::no lint XML report was produced in this build")
              sys.exit(0)
          errors, warnings = [], []
          for path in paths:
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for issue in root.iter("issue"):
                  location = issue.find("location")
                  where = "{0}:{1}".format(location.get("file"), location.get("line")) if location is not None else "?"
                  entry = "{0} | {1} | {2}".format(issue.get("id"), where, (issue.get("message") or "")[:200])
                  (errors if issue.get("severity") == "Error" else warnings).append(entry)
          print("::notice title=Lint::{0} error(s), {1} warning(s)".format(len(errors), len(warnings)))
          for entry in errors[:15]:
              print("::error title=Lint error::{0}".format(entry.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")))
          for entry in warnings[:5]:
              print("::warning title=Lint warning::{0}".format(entry.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")))
          PY

      # Room writes the current schema next to the committed ones while compiling. If that file is not tracked
      # by git, the repository cannot validate a future migration from this version, so say so loudly.
      - name: Check Room schema exports
        if: always()
        run: |
          ls -la app/schemas/com.campmeds.app.data.AppDatabase/ || true
          untracked=$(git status --porcelain -- app/schemas | grep '^??' || true)
          if [ -n "$untracked" ]; then
            echo "::warning title=Room schema not committed::generated schema files are missing from git:"
            echo "$untracked"
          fi

      - name: Compile instrumented tests
        run: |
          set -eo pipefail
          ./gradlew assembleDebugAndroidTest --console=plain 2>&1 | tee -a gradle-output.log

      # The migrations and the integrity guarantees are only proven by running them on a device, so the
      # suite is executed on an emulator. Compiling it is still a separate step above: that reports a broken
      # test source quickly, without waiting for a booted device.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          # The ATD image is built for headless instrumented tests: it boots faster and does not bring up the
          # UI apps that make the default image flaky on a runner without a GPU.
          target: aosp_atd
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: v2.2/CampMeds_V1_Fixed
          # Kept to one line: the action runs each line of `script` through sh separately. The script waits
          # for the device to finish booting and retries once if the runner cannot reach the emulator at all.
          script: bash ci/run-instrumented-tests.sh

      - name: Build Debug APK
        run: |
          set -eo pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a gradle-output.log

      # The failure text is published as a job summary and as an annotation: both can be read back through the
      # Actions API, unlike the console log, which some environments cannot download.
      - name: Publish Gradle output on failure
        if: failure()
        run: |
          # Gradle's console output only names failing tests, so pull the assertion text out of the JUnit XML.
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          chunks = []
          for path in sorted(glob.glob("app/build/reports/tests/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      for problem in case.findall(kind):
                          chunks.append(
                              "{0} > {1}\n    {2}".format(
                                  case.get("classname") or path,
                                  case.get("name"),
                                  (problem.get("message") or problem.get("type") or "").strip()[:3000],
                              )
                          )
          if chunks:
              open("test-failures.txt", "w", encoding="utf-8").write("\n\n".join(chunks))
          PY

          SOURCE=gradle-output.log
          if [ -s test-failures.txt ]; then SOURCE=test-failures.txt; fi

          {
            echo "Gradle output (tail) for ${{ github.sha }}"
            echo '```'
            tail -c 60000 "$SOURCE" 2>/dev/null || echo "no output captured"
            echo '```'
          } > failure-report.md
          cat failure-report.md >> "$GITHUB_STEP_SUMMARY"

          # One annotation survives per step: it carries the end of the report, where the failure detail is.
          python3 - <<'PY'
          import os

          path = "failure-report.md"
          text = open(path, encoding="utf-8", errors="replace").read() if os.path.exists(path) else "failure-report.md missing"
          escaped = text[-3800:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle output (tail)::{0}".format(escaped))
          PY

      # Counts are surfaced as annotations because those can be read back through the Actions API, unlike the
      # console log. Both suites are counted, whichever of them ran.
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          suites = {
              "Unit tests": "app/build/test-results/testDebugUnitTest/*.xml",
              "Instrumented tests": "app/build/outputs/androidTest-results/connected/**/*.xml",
          }
          for label, pattern in suites.items():
              tests = failures = errors = skipped = 0
              files = sorted(glob.glob(pattern, recursive=True))
              for path in files:
                  try:
                      root = ET.parse(path).getroot()
                  except Exception:
                      continue
                  # AGP writes either <testsuite> or a <testsuites> wrapper depending on the task.
                  for suite in root.iter("testsuite"):
                      tests += int(suite.get("tests") or 0)
                      failures += int(suite.get("failures") or 0)
                      errors += int(suite.get("errors") or 0)
                      skipped += int(suite.get("skipped") or 0)
                  for case in root.iter("testcase"):
                      for kind in ("failure", "error"):
                          for problem in case.findall(kind):
                              detail = "{0} > {1} :: {2}".format(
                                  case.get("classname") or path,
                                  case.get("name"),
                                  (problem.get("message") or problem.get("type") or "").strip()[:2000],
                              )
                              escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                              print("::error title={0}::{1}".format(label, escaped))
              if not files:
                  print("::notice title={0}::not run in this build".format(label))
              else:
                  print(
                      "::notice title={0}::{1} passed, {2} failed, {3} errored, {4} skipped ({5} result file(s))".format(
                          label, tests - failures - errors - skipped, failures, errors, skipped, len(files)
                      )
                  )
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-test-reports
          path: |
            v2.2/CampMeds_V1_Fixed/app/build/reports/tests
            v2.2/CampMeds_V1_Fixed/app/build/reports/androidTests
            v2.2/CampMeds_V1_Fixed/app/build/reports/lint-results-debug.html
            v2.2/CampMeds_V1_Fixed/app/build/reports/lint-results-debug.txt
            v2.2/CampMeds_V1_Fixed/app/build/outputs/androidTest-results
            v2.2/CampMeds_V1_Fixed/app/schemas
          if-no-files-found: ignore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-debug-apk
          path: v2.2/CampMeds_V1_Fixed/app/build/outputs/apk/debug/app-debug.apk
