name: Android Build Workflow

on:
  push:
    # main/master are the released lines. "arena/**" are the working branches this repository is developed
    # on, so a push there is built and tested instead of needing a manual dispatch.
    branches: ["main", "master", "arena/**", "integration/**"]
  pull_request:
    branches: ["main", "master", "arena/**", "integration/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      checks: write

    defaults:
      run:
        working-directory: v2.2/CampMeds_V1_Fixed

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The wrapper is generated rather than committed. Gradle's distribution is downloaded here, so this step
      # is also the first network dependency of the job; its output is captured so a failure is diagnosable from
      # the job summary (the console log is not reachable from every environment).
      - name: Generate Gradle Wrapper
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 8.7 2>&1 | tee -a gradle-output.log
          chmod +x gradlew

      - name: Diagnose Gradle wrapper setup
        if: failure()
        run: |
          {
            echo "### Gradle wrapper step failed"
            echo '```'
            tail -c 8000 gradle-output.log 2>/dev/null || echo "gradle-output.log missing"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------ signing
      #
      # The distributable APK must carry the SAME signing certificate as the installed app, otherwise Android
      # refuses to install it as an update ("App not installed: package conflicts with an existing package").
      # The persistent key is therefore read from repository secrets. It is never committed, never echoed, and
      # the decoded file is removed again before the job ends.
      #
      # If the secrets are absent the release build is skipped (with a warning) instead of producing an APK
      # signed by a throwaway debug key: such a file cannot update an existing installation, and publishing it
      # would be worse than publishing nothing.
      - name: Decode signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.CAMPMEDS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release signing key not configured::secrets.CAMPMEDS_KEYSTORE_BASE64 is not set, so no signed release APK can be produced. The debug APK is still built. See README 'Signing and updates'."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/campmeds-release.jks"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "keystore written to a temporary file; it is deleted by the cleanup step"
          # Only the certificate, never a password: the SHA-256 fingerprint is what an installed app reports,
          # so it is the value to compare when checking that an update will be accepted.
          keytool -list -v -keystore "$RUNNER_TEMP/campmeds-release.jks" \
            -storepass "${{ secrets.CAMPMEDS_KEYSTORE_PASSWORD }}" 2>/dev/null \
            | grep -E 'Alias name|SHA256:' || echo "::warning title=Keystore unreadable::the keystore secret was decoded but keytool could not read it"

      # Builds the release APK with the persistent key. Gradle fails with an explicit message if the key is
      # missing (see app/build.gradle.kts), which is why this step is skipped rather than allowed to fail.
      - name: Build signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          CAMPMEDS_KEYSTORE_PASSWORD: ${{ secrets.CAMPMEDS_KEYSTORE_PASSWORD }}
          CAMPMEDS_KEY_ALIAS: ${{ secrets.CAMPMEDS_KEY_ALIAS }}
          CAMPMEDS_KEY_PASSWORD: ${{ secrets.CAMPMEDS_KEY_PASSWORD }}
        run: |
          set -eo pipefail
          export CAMPMEDS_KEYSTORE_FILE="$RUNNER_TEMP/campmeds-release.jks"
          ./gradlew assembleRelease --console=plain 2>&1 | tee -a gradle-output.log

      # Reports the certificate the APK actually carries, so the user can compare it with the one on the
      # installed device (App info -> the version that is currently installed). No secret is printed.
      - name: Report APK signing certificate
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          python3 - <<'PY'
          import glob, os, subprocess, sys
          apks = glob.glob("app/build/outputs/apk/release/*.apk")
          if not apks:
              print("::notice title=Release APK::no release APK was produced in this build")
              sys.exit(0)
          for apk in apks:
              print("release artifact:", os.path.basename(apk))
          build_tools = sorted(glob.glob(os.environ.get("ANDROID_HOME", "/usr/local/lib/android/sdk") + "/build-tools/*"))
          apksigner = os.path.join(build_tools[-1], "apksigner") if build_tools else "apksigner"
          for apk in apks:
              try:
                  out = subprocess.run([apksigner, "verify", "--print-certs", "-v", apk],
                                       capture_output=True, text=True, check=False)
                  for line in (out.stdout or out.stderr).splitlines():
                      if "SHA-256" in line or "Verified using" in line:
                          print("::notice title=APK signing certificate::" + line.strip()[:300])
              except Exception as exc:  # pragma: no cover - diagnostics only
                  print("::warning title=apksigner unavailable::" + str(exc)[:200])
          PY

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/campmeds-release.jks"

      - name: Build Debug APK
        run: |
          set -eo pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee -a gradle-output.log

      # Every Gradle run appends to gradle-output.log so the failure step below can publish it: the log and
      # artifact download endpoints are not reachable from every environment, but the API is.
      - name: Run unit tests
        run: |
          set -eo pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a gradle-output.log

      - name: Compile instrumented tests
        run: |
          set -eo pipefail
          ./gradlew assembleDebugAndroidTest --console=plain 2>&1 | tee -a gradle-output.log

      # The migrations and the integrity guarantees are only proven by running them on a device, so the
      # suite is executed on an emulator. Compiling it is still a separate step above: that reports a broken
      # test source quickly, without waiting for a booted device.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          # The ATD image is built for headless instrumented tests: it boots faster and does not bring up the
          # UI apps that make the default image flaky on a runner without a GPU.
          target: aosp_atd
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: v2.2/CampMeds_V1_Fixed
          # Kept to one line: the action runs each line of `script` through sh separately. The script waits
          # for the device to finish booting and retries once if the runner cannot reach the emulator at all.
          script: bash ci/run-instrumented-tests.sh

      # The failure text is published as a job summary and as an annotation: both can be read back through the
      # Actions API, unlike the console log, which some environments cannot download.
      - name: Publish Gradle output on failure
        if: failure()
        run: |
          # Gradle's console output only names failing tests, so pull the assertion text out of the JUnit XML.
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          chunks = []
          for path in sorted(glob.glob("app/build/test-results/**/*.xml", recursive=True)):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter("testcase"):
                  for kind in ("failure", "error"):
                      for problem in case.findall(kind):
                          chunks.append(
                              "{0} > {1}\n    {2}".format(
                                  case.get("classname") or path,
                                  case.get("name"),
                                  (problem.get("message") or problem.text or problem.get("type") or "").strip()[:3000],
                              )
                          )
          if chunks:
              open("test-failures.txt", "w", encoding="utf-8").write("\n\n".join(chunks))
          PY

          SOURCE=gradle-output.log
          if [ -s test-failures.txt ]; then SOURCE=test-failures.txt; fi

          {
            echo "Gradle output (tail) for ${{ github.sha }}"
            echo '```'
            tail -c 60000 "$SOURCE" 2>/dev/null || echo "no output captured"
            echo '```'
          } > failure-report.md
          # The Gradle log itself is always included: a configuration/script error is what breaks the build,
          # and the console log endpoint is not reachable from every environment.
          if [ -s gradle-output.log ]; then
            echo "Gradle log (tail)" >> failure-report.md
            echo '```' >> failure-report.md
            tail -c 30000 gradle-output.log >> failure-report.md
            echo '```' >> failure-report.md
          fi
          cat failure-report.md >> "$GITHUB_STEP_SUMMARY"

          # One annotation survives per step: it carries the end of the report, where the failure detail is.
          python3 - <<'PY'
          import os

          path = "failure-report.md"
          text = open(path, encoding="utf-8", errors="replace").read() if os.path.exists(path) else "failure-report.md missing"
          escaped = text[-3800:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Gradle output (tail)::{0}".format(escaped))
          PY

      # Counts are surfaced as annotations because those can be read back through the Actions API, unlike the
      # console log. Both suites are counted, whichever of them ran.
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          suites = {
              "Unit tests": "app/build/test-results/testDebugUnitTest/*.xml",
              "Instrumented tests": "app/build/outputs/androidTest-results/connected/**/*.xml",
          }
          for label, pattern in suites.items():
              tests = failures = errors = skipped = 0
              files = sorted(glob.glob(pattern, recursive=True))
              for path in files:
                  try:
                      root = ET.parse(path).getroot()
                  except Exception:
                      continue
                  # AGP writes either <testsuite> or a <testsuites> wrapper depending on the task.
                  for suite in root.iter("testsuite"):
                      tests += int(suite.get("tests") or 0)
                      failures += int(suite.get("failures") or 0)
                      errors += int(suite.get("errors") or 0)
                      skipped += int(suite.get("skipped") or 0)
                  for case in root.iter("testcase"):
                      for kind in ("failure", "error"):
                          for problem in case.findall(kind):
                              detail = "{0} > {1} :: {2}".format(
                                  case.get("classname") or path,
                                  case.get("name"),
                                  (problem.get("message") or problem.text or problem.get("type") or "").strip()[:2000],
                              )
                              escaped = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                              print("::error title={0}::{1}".format(label, escaped))
              if not files:
                  print("::notice title={0}::not run in this build".format(label))
              else:
                  print(
                      "::notice title={0}::{1} passed, {2} failed, {3} errored, {4} skipped ({5} result file(s))".format(
                          label, tests - failures - errors - skipped, failures, errors, skipped, len(files)
                      )
                  )
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-test-reports
          path: |
            v2.2/CampMeds_V1_Fixed/app/build/reports/tests
            v2.2/CampMeds_V1_Fixed/app/build/reports/androidTests
            v2.2/CampMeds_V1_Fixed/app/build/outputs/androidTest-results
          if-no-files-found: ignore

      # Expose the generated schema through the Checks API as well as the artifact. This allows review
      # in restricted environments that cannot reach the artifact storage host. No patient data is included.
      - name: Publish generated schema for review
        if: always()
        run: |
          python3 - <<'PYSCHEMA'
          import base64, gzip, pathlib
          for path in pathlib.Path("app/schemas").glob("*/7.json"):
              encoded = base64.b64encode(gzip.compress(path.read_bytes())).decode()
              print("::notice title=Room schema 7 gzip-base64::" + encoded)
          PYSCHEMA

      - name: Upload schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-room-schemas
          path: v2.2/CampMeds_V1_Fixed/app/schemas

      - name: Upload Build Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-debug-apk
          path: v2.2/CampMeds_V1_Fixed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      # The signed, installable-as-an-update artifact. Only produced when the persistent key is configured.
      - name: Upload signed release APK
        if: always() && steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: campmeds-release-apk
          path: v2.2/CampMeds_V1_Fixed/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
